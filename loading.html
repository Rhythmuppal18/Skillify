<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="3;url=index.html">
  <title>Loading... | Skillify</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Dark Mode Auto-Detection via CSS Media Query */
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #121A15;
        --panel: #1A2620;
        --ink: #E8EFE9;
        --ink-soft: #9DB0A1;
        --rule: #2C3E33;
        --accent: #43A047;
        --accent-hover: #2F6F4F;
        --accent-soft: #1E3827;
        --shadow-emerald: 0 6px 20px -2px rgba(47, 111, 79, 0.4);
      }
    }

    body.loader-body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--paper);
      color: var(--ink);
      font-family: var(--font-body);
      overflow: hidden;
      position: relative;
    }

    /* Ambient background glowing circle */
    .loader-glow {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(5, 150, 105, 0.18) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.85); opacity: 0.5; }
      100% { transform: scale(1.15); opacity: 0.9; }
    }

    /* Neo-brutalist card container matching Skillify design system */
    .loader-card {
      position: relative;
      z-index: 2;
      background: var(--panel);
      border: 2px solid var(--ink);
      border-radius: var(--radius-lg);
      box-shadow: 8px 8px 0 var(--accent-soft), 8px 8px 0 2px var(--ink);
      padding: 44px 40px;
      width: 90%;
      max-width: 520px;
      text-align: center;
      animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardAppear {
      0% { opacity: 0; transform: translateY(20px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Eyebrow badge */
    .loader-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent);
      border-radius: 50%;
      animation: dotPulse 1.2s infinite ease-in-out;
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    /* Logo title */
    .loader-logo-wrap {
      margin-bottom: 8px;
    }

    .loader-logo {
      font-family: var(--font-mono);
      font-size: 36px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.02em;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .loader-logo .prompt {
      color: var(--accent);
    }

    .loader-logo .cursor {
      display: inline-block;
      width: 10px;
      height: 28px;
      background-color: var(--accent);
      margin-left: 6px;
      animation: blinkCursor 0.8s infinite;
    }

    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .loader-subtitle {
      font-size: 14px;
      color: var(--ink-soft);
      margin-bottom: 32px;
      font-weight: 500;
    }

    /* Outer Progress Bar Wrap */
    .loader-progress-container {
      margin-bottom: 20px;
    }

    .loader-progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-soft);
      margin-bottom: 8px;
    }

    .loader-progress-wrap {
      width: 100%;
      height: 28px;
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: var(--radius-sm);
      padding: 3px;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }

    .loader-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent) 0%, #10B981 100%);
      border-radius: 4px;
      animation: fillProgress 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      position: relative;
      overflow: hidden;
    }

    /* Sheen animation over progress bar */
    .loader-progress-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    @keyframes fillProgress {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    /* CSS Keyframe percentage counter */
    .percent-counter::after {
      content: "0%";
      animation: percentCount 3s linear forwards;
    }

    @keyframes percentCount {
      0% { content: "0%"; }
      15% { content: "18%"; }
      35% { content: "42%"; }
      60% { content: "68%"; }
      85% { content: "89%"; }
      100% { content: "100%"; }
    }

    /* Terminal Console Log Output */
    .loader-console {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--ink-soft);
      text-align: left;
      margin-bottom: 24px;
      height: 44px;
      display: flex;
      align-items: center;
    }

    .console-text::after {
      content: "> Loading CS Question Bank...";
      color: var(--accent);
      font-weight: 600;
      animation: consoleLog 3s steps(1) forwards;
    }

    @keyframes consoleLog {
      0% { content: "> Loading CS Question Bank..."; }
      30% { content: "> Syncing 1v1 CyberBot AI Arena..."; }
      60% { content: "> Compiling Debugging & SQL Modules..."; }
      88% { content: "> Launching Skillify UI... [READY]"; }
    }

    /* Redirect hint footer */
    .loader-footer {
      border-top: 1px dashed var(--rule);
      padding-top: 18px;
      font-size: 13px;
      color: var(--ink-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .loader-footer a.btn-enter {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: var(--accent);
      color: #ffffff;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      border: 2px solid var(--ink);
      border-radius: var(--radius-sm);
      text-decoration: none;
      box-shadow: 2px 2px 0 var(--ink);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .loader-footer a.btn-enter:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--ink);
    }
  </style>
</head>
<body class="loader-body">

  <div class="loader-glow"></div>

  <main class="loader-card" aria-live="polite">
    <div class="loader-badge">
      <span class="pulse-dot"></span>
      Initializing Platform
    </div>

    <div class="loader-logo-wrap">
      <div class="loader-logo">
        <span class="prompt">&gt;</span>&nbsp;Skillify<span class="cursor"></span>
      </div>
    </div>

    <p class="loader-subtitle">CS Academic Evaluation &amp; Assessment Arena</p>

    <div class="loader-progress-container">
      <div class="loader-progress-header">
        <span>Status: Preparing Engine</span>
        <span class="percent-counter"></span>
      </div>
      <div class="loader-progress-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Loading progress">
        <div class="loader-progress-bar"></div>
      </div>
    </div>

    <div class="loader-console">
      <span class="console-text"></span>
    </div>

    <footer class="loader-footer">
      <span>Redirecting automatically in 3s...</span>
      <a href="index.html" class="btn-enter">Enter Site &rarr;</a>
    </footer>
  </main>

</body>
</html>
